#    image: postgres_init
#FROM postgres:12.1-alpine
# WORKDIR /docker-entrypoint-initdb.d
# ADD psql_init.sh .
  db_django:
    build:
      context: .
      dockerfile: Dockerfile_postgres
    image: postgres_w_cron
    env_file:
      - .env
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # All cron-scheduled maintenance (backup, prune, weekly vacuum swap)
      # lives in this container now -- set TZ so crontab_root's times mean
      # Eastern, not UTC. tzdata (Dockerfile_postgres) has to be installed
      # for this to actually take effect; without it Alpine silently stays
      # on UTC. NOTE: this also shifts the *existing* daily backup's
      # actual wall-clock time (it was already "0 2 * * *", just
      # previously meaning 2am UTC == ~10pm Eastern the prior day; now it
      # means 2am Eastern).
      TZ: America/New_York
#      PGDATA: /database
    volumes:
      - ${DB_FILES_LOCATION}:/var/lib/postgresql/data
      # Initialization script - see Postgres Docker documentation.
      - ${DJANGO_FILES_ROOT}/dockerize/psql_init.sh:/docker-entrypoint-initdb.d/psql_init.sh
      # Add a file to the daily crontab directory that backs up the database.
      # Run by the run-parts command, which hates periods in filenames, hence why
      # I don't make a .sh suffix in the container. Bind-mounted (not baked into
      # the image via Dockerfile_postgres) so editing it doesn't require a full
      # rebuild like it used to -- same fix applied to picasa_api's startup.sh.
      # NOTE: a single-file bind mount like this stays attached to whatever
      # inode existed at container-create time -- editing the host file (most
      # editors replace-via-rename, which changes the inode) needs
      # `docker compose up -d --force-recreate db_django` to actually pick up,
      # not just a plain restart or a config-less `up -d`.
      - ${DJANGO_FILES_ROOT}/dockerize/postgres_bak.sh:/etc/periodic/daily/postgres_bak_sh
      - ${DJANGO_FILES_ROOT}/dockerize/prune_backups.py:/etc/periodic/daily/prune_backups.py
      # Weekly vacuum-swap script (the crontab that runs it is COPY'd into
      # the image at build time, not bind-mounted here -- see
      # Dockerfile_postgres's comment on crontab_root for why: BusyBox
      # crond silently ignores a crontab not owned by root, and a bind
      # mount would keep it owned by whatever this file's host owner is).
      - ${DJANGO_FILES_ROOT}/dockerize/weekly_vacuum_swap.py:/etc/periodic/weekly_vacuum_swap.py
      - /mnt/fast_storage/appdata/django_picasa/backups:/backup
      # Lets weekly_vacuum_swap.py stop/start/exec picasa_api directly --
      # this is the standard Docker-outside-of-Docker pattern. Security
      # tradeoff worth knowing: anything that can run arbitrary commands
      # in THIS container can now also control (or escape to) the whole
      # host via the Docker daemon, not just this DB.
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - "user=postgres"
    container_name: db_picasa
    ports:
      - '5433:5432'
    networks:
      - traefik_proxy

  task_redis:
    image: redis:8.6-alpine
    # env_file:
    #   - .env_picasa
    restart: always
    env_file:
